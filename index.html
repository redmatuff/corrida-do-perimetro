<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Painel interativo REDMAT com quatro jogos de matemática.">
  <title>Painel Interativo REDMAT</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      padding: 18px 20px;
      text-align: center;
      background: linear-gradient(90deg, #28dfb2, #7657ff, #ed4b64);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
    }

    header p {
      margin: 7px 0 0;
    }

    main {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 20px;
    }

    .painel {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 24px rgba(32, 43, 68, 0.18);
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .alternativo {
      margin: 16px 0 4px;
      text-align: center;
      font-size: 0.95rem;
    }

    .alternativo a {
      color: #5538db;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>Painel Interativo REDMAT</h1>
    <p>Quatro jogos para aprender matemática brincando</p>
  </header>

  <main>
    <section class="painel" aria-label="Painel de jogos interativos">
      <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHJj3Q70P4/cJqKNKw3exuZv4gIvUwjsQ/view?embed"
        title="Painel de Jogos REDMAT"
        allowfullscreen
        allow="fullscreen">
      </iframe>
    </section>

    <p class="alternativo">
      Se o painel não carregar, <a href="https://www.canva.com/design/DAHJj3Q70P4/cJqKNKw3exuZv4gIvUwjsQ/view" target="_blank" rel="noopener noreferrer">abra diretamente no Canva</a>.
    </p>
  </main>
</body>
</html>
